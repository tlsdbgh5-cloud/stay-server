name = "stay-server"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Pages allowed to connect (comma separated, no trailing slash)
ALLOWED_ORIGINS = "https://tlsdbgh5-cloud.github.io"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
